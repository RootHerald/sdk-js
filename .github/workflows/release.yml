name: Release

# Triggered on tags like v0.1.0 — publishes ALL workspace packages whose
# version matches the tag. For per-package versioning, use Changesets and
# replace this workflow accordingly.
on:
  push:
    tags:
      - 'v*'

# Required for npm provenance via OIDC (Sigstore-signed attestation)
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version read from packageManager field in root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships with npm 11.x, which has built-in OIDC trusted-
          # publisher support. Node 20's bundled npm 10.x is too old.
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Belt-and-suspenders: explicitly install latest npm so OIDC support is
      # guaranteed regardless of which minor Node 24 brings.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      # Trusted publishing — no NPM_TOKEN required. The npm CLI uses the
      # GitHub Actions OIDC token to authenticate. Each package must have
      # "publishConfig.access": "public" + a trusted publisher configured
      # on the npm package page at npmjs.com.
      #
      # Pre-release tags (v0.1.0-alpha.1, v0.2.0-beta.3, etc.) ship under
      # the matching dist-tag (alpha / beta / rc) instead of `latest`, so
      # casual `npm install @rootherald/node` keeps pulling stable releases.
      # Diagnostic: print the GITHUB_* env vars npm uses to decide which
      # trusted publisher to match against. If npm publish still 404s,
      # cross-check these values against the npm trusted publisher config.
      - name: Show OIDC identity claims
        run: |
          echo "GITHUB_REPOSITORY:       $GITHUB_REPOSITORY"
          echo "GITHUB_REPOSITORY_OWNER: $GITHUB_REPOSITORY_OWNER"
          echo "GITHUB_WORKFLOW_REF:     $GITHUB_WORKFLOW_REF"
          echo "GITHUB_REF:              $GITHUB_REF"
          echo "GITHUB_REF_TYPE:         $GITHUB_REF_TYPE"
          echo "GITHUB_REF_NAME:         $GITHUB_REF_NAME"
          echo "GITHUB_EVENT_NAME:       $GITHUB_EVENT_NAME"

      # `npm publish` (unlike `pnpm publish`) does NOT rewrite the workspace:
      # protocol, so a literal "@rootherald/contracts":"workspace:*" would ship
      # in the tarball and make the package uninstallable
      # (npm ERR Unsupported URL Type "workspace:"). Materialize every intra-
      # workspace dep to its concrete published version before publishing.
      # Publish order below (glob: browser, contracts, node) already publishes
      # a dependency before its dependents.
      - name: "Materialize workspace: deps to concrete versions"
        run: |
          node -e '
            const fs = require("fs");
            const dirs = fs.readdirSync("packages");
            const ver = {};
            for (const d of dirs) {
              const pj = `packages/${d}/package.json`;
              if (fs.existsSync(pj)) ver[JSON.parse(fs.readFileSync(pj, "utf8")).name] = JSON.parse(fs.readFileSync(pj, "utf8")).version;
            }
            for (const d of dirs) {
              const pj = `packages/${d}/package.json`;
              if (!fs.existsSync(pj)) continue;
              const j = JSON.parse(fs.readFileSync(pj, "utf8"));
              let changed = false;
              for (const field of ["dependencies", "peerDependencies", "optionalDependencies"]) {
                const deps = j[field];
                if (!deps) continue;
                for (const name of Object.keys(deps)) {
                  if (typeof deps[name] === "string" && deps[name].startsWith("workspace:") && ver[name]) {
                    deps[name] = ver[name]; // pin exact (prerelease-safe, unlike ^ ranges)
                    changed = true;
                  }
                }
              }
              if (changed) { fs.writeFileSync(pj, JSON.stringify(j, null, 2) + "\n"); console.log("materialized workspace deps in", j.name); }
            }
          '

      - name: Publish to npm with provenance
        run: |
          # Determine the dist-tag to publish under.
          #
          # `npm publish --tag X` sets the tag AT PUBLISH TIME and works fine
          # under OIDC. A separate `npm dist-tag add` does NOT — the trusted-
          # publishing token is scoped to publish and the endpoint answers E401.
          # So the tag has to be chosen here; there is no second chance later
          # without a long-lived credential.
          #
          # While pre-1.0 EVERY release is a prerelease. Mapping those to
          # `alpha` leaves `latest` wherever npm first pinned it — which is how
          # it ended up stuck on 0.1.0-alpha.1 while alpha.9 was current,
          # serving eight-version-old code to a plain `npm install`. For a
          # package with no stable release, the newest prerelease IS the latest
          # release, so publish it as such.
          #
          # At 1.0 this inverts on its own: a bare vX.Y.Z tag takes the else
          # branch, `latest` becomes the stable line, and prereleases published
          # from a v1.1.0-beta.1 tag correctly go to `beta` instead.
          tag_ref="${GITHUB_REF_NAME#v}"
          if [[ "$tag_ref" == *-* ]]; then
            if [[ "$tag_ref" == 0.* ]]; then
              dist_tag="latest"      # pre-1.0: newest prerelease is the release
            else
              dist_tag="${tag_ref#*-}"
              dist_tag="${dist_tag%%.*}"
            fi
          else
            dist_tag="latest"
          fi
          echo "Publishing under dist-tag: $dist_tag (from $GITHUB_REF_NAME)"
          echo "npm version: $(npm --version)"

          # Use npm publish directly (not pnpm) so OIDC env propagation is
          # straightforward. Loop over each published-eligible package.
          #
          # Trusted publishing CANNOT bootstrap a package that does not exist on
          # npm yet: there is no package page to attach a trusted publisher to,
          # so the registry answers `404 PUT` regardless of a valid OIDC token.
          # A never-published package therefore needs one manual, authenticated
          # `npm publish` before CI can ever take over.
          #
          # Skip those rather than aborting, so one un-bootstrapped package
          # cannot block every other package in the workspace from shipping —
          # which is exactly what happened at v0.1.0-alpha.8.
          failed=0
          for pkg_dir in packages/*/; do
            [ -f "$pkg_dir/package.json" ] || continue
            grep -q '"private": *true' "$pkg_dir/package.json" && continue
            name=$(node -p "require('./$pkg_dir/package.json').name")

            if ! npm view "$name" version >/dev/null 2>&1; then
              echo "::warning::$name has never been published. Trusted publishing cannot create it — run 'npm publish --access public' once from an authenticated account, then CI takes over."
              continue
            fi

            echo "===> publishing $name"
            if ! (cd "$pkg_dir" && npm publish --provenance --access public --tag "$dist_tag"); then
              echo "::error::publish failed for $name"
              failed=1
            fi
          done
          exit $failed

      # A post-publish `npm dist-tag add` step used to live here as a fallback.
      # Removed: it always failed with E401 because the OIDC token is scoped to
      # publish, and it is unnecessary now that the publish step chooses the
      # right tag directly. Publishing is fully automated with no credential.
